[project]
name = "qubo-dispatch"
version = "0.1.0"
description = "Formulate emergency rescue dispatch as a QUBO. Solve it with quantum or classical backends behind one interface."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = ["numpy>=1.26", "scikit-learn>=1.5"]

[project.optional-dependencies]
quantum = ["qiskit==1.2.4", "qiskit-aer==0.15.1", "qiskit-optimization==0.6.1"]
classical = ["ortools==9.11.4210"]
dev = ["pytest>=8.0"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
